{% extends "base.html" %}
{% block content %}
<h1>Projects</h1>
<a href="{% url 'project_create' %}">➕ Add Project</a>
<ul>
  {% for project in object_list %}
    <li>
      <a href="{% url 'project_detail' project.pk %}">
        {{ project.title }}
      </a>
    </li>
  {% empty %}
    <li>No projects yet.</li>
  {% endfor %}
</ul>
{% endblock %}
